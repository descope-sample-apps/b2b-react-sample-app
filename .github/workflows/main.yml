name: E2E Tests
on: [push]
jobs:
  cypress-run:
    name: Cypress E2E Tests
    runs-on: ubuntu-latest
    env:
      REACT_APP_DESCOPE_PROJECT_ID: ${{ secrets.REACT_APP_DESCOPE_PROJECT_ID }}
      REACT_APP_DESCOPE_MANAGEMENT_KEY: ${{ secrets.REACT_APP_DESCOPE_MANAGEMENT_KEY }}
      # CI: false
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26

      - name: Install dependencies
        run: yarn install

      # - name: Build
      #   run: yarn build

      # ponytail: the action's built-in wait-on aborts on the first refused
      # connection ("Socket closed before the connection was established"),
      # so start the server and poll it ourselves.
      - name: Start app
        run: |
          BROWSER=none yarn start &
          timeout 240 bash -c 'until curl -sf http://localhost:3000 >/dev/null; do sleep 2; done'

      - name: Cypress run
        uses: cypress-io/github-action@v7
        with:
          install: false
          browser: chrome

      - name: Upload screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-screenshots
          path: cypress/screenshots